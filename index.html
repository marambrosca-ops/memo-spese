<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff6b35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Memo spese</title>
<style>
:root{
  --bg:#fffbf7; --card:#ffffff; --primary:#ff6b35; --primary-dark:#e85d26;
  --text:#2b2d42; --muted:#8d99ae; --line:#f0f2f5; --danger:#d90429; --success:#2b9348;
  --shadow:0 10px 30px rgba(255,107,53,.08);
}
*{box-sizing:border-box} 
body{
  margin:0;
  background:
    radial-gradient(circle at 90% 0%,rgba(255,107,53,.12),transparent 30%),
    radial-gradient(circle at 10% 30%,rgba(255,209,102,.15),transparent 25%),
    linear-gradient(180deg,#fffbf7 0%,#fef7f0 100%);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.app{max-width:560px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 18px calc(110px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-0.5px;color:#2b2d42}
.icon{width:42px;height:42px;border:0;border-radius:14px;background:var(--primary);box-shadow:0 8px 20px rgba(255,107,53,.25);font-size:20px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s ease}
.icon:active{transform:scale(0.95)}

/* Month Selector Bar */
.month-selector{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border:1px solid rgba(255,224,204,.8);border-radius:16px;padding:8px 14px;margin-bottom:16px;box-shadow:0 4px 16px rgba(0,0,0,.03)}
.month-btn{background:none;border:0;font-size:16px;font-weight:bold;color:var(--primary);cursor:pointer;padding:6px 12px;border-radius:10px;transition:background .15s}
.month-btn:hover{background:#fff0eb}
.month-title{font-size:16px;font-weight:700;text-transform:capitalize;color:#2b2d42}

.card{background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border:1px solid rgba(255,224,204,.8);border-radius:22px;box-shadow:var(--shadow);padding:22px;margin-bottom:16px}
.hero{background:linear-gradient(135deg,#ff6b35 0%,#f77f00 50%,#fcbf49 100%);color:#fff;border:0;padding:24px;box-shadow:0 12px 32px rgba(247,127,0,.25)}
.hero .label{opacity:.9;font-size:14px;font-weight:500}
.amount{font-size:40px;font-weight:850;letter-spacing:-1px;margin:8px 0 2px}

.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 4px 10px}
.section-title h2{font-size:18px;margin:0;font-weight:700;color:#2b2d42}
.section-title span{font-size:13px;color:var(--muted);font-weight:600}

/* Filters bar */
.filter-tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.filter-tab{border:1px solid rgba(255,224,204,1);background:#fff;border-radius:12px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s}
.filter-tab.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 4px 12px rgba(255,107,53,.25)}

.list{padding:0;overflow:hidden}
.item{display:flex;align-items:center;gap:14px;padding:16px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:#f77f00;box-shadow:0 0 0 4px rgba(247,127,0,.15)}
.item-main{flex:1;min-width:0}
.item-main b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#2b2d42}
.item-main span{color:var(--muted);font-size:12px;font-weight:500}
.item-amount{font-weight:750;font-size:16px;color:#2b2d42}
.actions{display:flex;gap:6px}
.smallbtn{border:0;background:#fff0eb;border-radius:10px;width:34px;height:34px;font-size:13px;color:#e85d26;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.smallbtn:hover{background:#ffe3db}
.empty{text-align:center;color:var(--muted);padding:32px 10px;font-size:14px;font-weight:500}

.fab{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));
  width:min(92%,420px);height:54px;border:0;border-radius:16px;
  background:linear-gradient(135deg,#ff6b35 0%,#f77f00 100%);color:#fff;font-weight:750;font-size:16px;
  box-shadow:0 10px 25px rgba(255,107,53,.35);cursor:pointer;z-index:10;
  transition:transform .15s;
}
.fab:active{transform:translateX(-50%) scale(0.97)}

dialog{border:0;border-radius:24px;width:min(92%,520px);padding:0;box-shadow:0 25px 60px rgba(43,45,66,.15);background:#ffffff}
dialog::backdrop{background:rgba(43,45,66,.4);backdrop-filter:blur(4px)}
.modal{padding:24px}
.modal h2{margin:0 0 18px;font-weight:750;color:#2b2d42}
.close{float:right;border:0;background:#fff0eb;border-radius:10px;width:34px;height:34px;font-size:16px;color:#e85d26;cursor:pointer;display:flex;align-items:center;justify-content:center}
.close:hover{background:#ffe3db}

label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:14px 0 6px}
input{width:100%;padding:14px;border:1px solid #ffd6c2;border-radius:14px;font-size:16px;font-weight:500;outline:none;background:#fffbf7;color:#2b2d42;-webkit-appearance:none;transition:border-color .15s, box-shadow .15s}
input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,107,53,.15);background:#fff}

.save{width:100%;border:0;border-radius:14px;background:linear-gradient(135deg,#ff6b35 0%,#f77f00 100%);color:#fff;padding:15px;margin-top:20px;font-size:16px;font-weight:750;cursor:pointer;box-shadow:0 8px 20px rgba(255,107,53,.25)}
.save:active{transform:scale(0.98)}

.backup-section{margin-top:24px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.backup-btn{background:none;border:1px solid #ffd6c2;color:#8d99ae;padding:8px 12px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s}
.backup-btn:hover{background:#fff0eb}
.danger-btn{border-color:#ffccd5;color:#d90429}
.danger-btn:hover{background:#fff0f3}

@media (min-width:560px){body{padding-top:10px}.fab{position:static;transform:none;width:100%;margin-top:6px}}
</style>
</head>
<body>
<main class="app">
<header>
  <div><h1>Memo spese</h1></div>
  <button class="icon" onclick="openModal()" title="Aggiungi Spesa">＋</button>
</header>

<!-- Selettore Mese -->
<div class="month-selector">
  <button class="month-btn" onclick="changeMonth(-1)">❮</button>
  <div class="month-title" id="monthTitle">Mese Anno</div>
  <button class="month-btn" onclick="changeMonth(1)">❯</button>
</div>

<section class="card hero">
  <div class="label" id="heroLabel">Totale spese del mese</div><div class="amount" id="total">€ 0,00</div>
</section>

<div class="section-title">
  <h2>Movimenti</h2>
  <span id="count">0 spese</span>
</div>

<div class="filter-tabs" id="filterTabs"></div>

<section class="card list" id="list"><div class="empty">Non hai ancora inserito nessuna spesa per questo mese.</div></section>

<button class="fab" onclick="openModal()">＋ Aggiungi spesa</button>

<div class="backup-section">
  <button class="backup-btn" onclick="exportData()">Esporta JSON</button>
  <button class="backup-btn" onclick="importDataClick()">Importa JSON</button>
  <button class="backup-btn danger-btn" onclick="resetMonthData()">Resetta mese corrente</button>
  <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
</div>
</main>

<!-- Modale Aggiungi/Modifica Spesa -->
<dialog id="dlg">
<form class="modal" method="dialog" onsubmit="saveExpense(event)">
<button type="button" class="close" onclick="dlg.close()">×</button>
<h2 id="modalTitle">Nuova spesa</h2>
<label>Importo</label><input id="amount" inputmode="decimal" placeholder="0,00" required>
<label>Descrizione</label><input id="desc" maxlength="80" placeholder="Es. spesa alimentare" required>
<button class="save">Salva spesa</button>
</form>
</dialog>

<script>
const STORAGE_KEY = 'memo-spese-solare';

let appData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
  expenses: []
};

let now = new Date();
let currentYear = now.getFullYear();
let currentMonth = now.getMonth();

let editingId = null;
let currentFilter = 'ALL';

const euro = n => new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n);

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
  render();
}

function changeMonth(direction) {
  currentMonth += direction;
  if(currentMonth > 11) {
    currentMonth = 0;
    currentYear++;
  } else if(currentMonth < 0) {
    currentMonth = 11;
    currentYear--;
  }
  render();
}

function openModal(id = null) {
  editingId = id;
  document.getElementById('modalTitle').textContent = id === null ? 'Nuova spesa' : 'Modifica spesa';
  const e = id === null ? null : appData.expenses.find(x => x.id === id);
  
  document.getElementById('amount').value = e ? String(e.amount).replace('.', ',') : '';
  document.getElementById('desc').value = e?.desc || '';
  
  dlg.showModal();
  setTimeout(() => document.getElementById('amount').focus(), 100);
}

function saveExpense(ev) {
  ev.preventDefault();
  let raw = document.getElementById('amount').value.trim().replace(/\./g, '').replace(',', '.');
  let val = parseFloat(raw);
  if (!Number.isFinite(val) || val <= 0) return;

  let descVal = document.getElementById('desc').value.trim();
  if(!descVal) descVal = 'Spesa';

  const nowTimestamp = new Date();
  const targetMonthStr = `${nowTimestamp.getFullYear()}-${String(nowTimestamp.getMonth() + 1).padStart(2, '0')}`;

  const obj = {
    id: editingId ?? Date.now(),
    date: editingId ? (appData.expenses.find(x => x.id === editingId)?.date || nowTimestamp.toISOString()) : nowTimestamp.toISOString(),
    month: editingId ? (appData.expenses.find(x => x.id === editingId)?.month || targetMonthStr) : targetMonthStr,
    amount: Math.round(val * 100) / 100,
    desc: descVal
  };

  if (editingId === null) {
    appData.expenses.unshift(obj);
  } else {
    appData.expenses = appData.expenses.map(x => x.id === editingId ? obj : x);
  }
  saveData();
  dlg.close();
}

function removeExpense(id) {
  if (confirm('Eliminare questa spesa?')) {
    appData.expenses = appData.expenses.filter(x => x.id !== id);
    saveData();
  }
}

function resetMonthData() {
  const monthNames = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];
  if (confirm(`Sei sicuro di voler azzerare tutte le spese di ${monthNames[currentMonth]} ${currentYear}?`)) {
    const targetMonthStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
    appData.expenses = appData.expenses.filter(e => {
      let m = e.month || (e.date ? e.date.substring(0, 7) : '');
      return m !== targetMonthStr;
    });
    saveData();
  }
}

function setFilter(filter) {
  currentFilter = filter;
  render();
}

function exportData() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
  const dlAnchorElem = document.createElement('a');
  dlAnchorElem.setAttribute("href", dataStr);
  dlAnchorElem.setAttribute("download", "memo_spese_backup.json");
  dlAnchorElem.click();
}

function importDataClick() {
  document.getElementById('importFile').click();
}

function importData(event) {
  const fileReader = new FileReader();
  if(event.target.files[0]) {
    fileReader.readAsText(event.target.files[0], "UTF-8");
    fileReader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if(parsed.expenses && Array.isArray(parsed.expenses)) {
          appData = parsed;
          saveData();
          alert('Dati importati con successo!');
        } else {
          alert('File di backup non compatibile.');
        }
      } catch(err) {
        alert('Errore durante la lettura del file.');
      }
    };
  }
}

function render() {
  const monthNames = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];
  document.getElementById('monthTitle').textContent = `${monthNames[currentMonth]} ${currentYear}`;

  const targetMonthStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;

  const monthExpenses = appData.expenses.filter(e => {
    let m = e.month || (e.date ? e.date.substring(0, 7) : '');
    return m === targetMonthStr;
  });

  const grandTotal = monthExpenses.reduce((acc, e) => acc + e.amount, 0);
  document.getElementById('total').textContent = euro(grandTotal);

  let filterTabsHtml = `<div class="filter-tab ${currentFilter === 'ALL' ? 'active' : ''}" onclick="setFilter('ALL')">Tutte</div>`;
  filterTabsHtml += `<div class="filter-tab ${currentFilter === 'WEEK' ? 'active' : ''}" onclick="setFilter('WEEK')">Questa settimana</div>`;
  document.getElementById('filterTabs').innerHTML = filterTabsHtml;

  let filteredExpenses = monthExpenses;
  if(currentFilter === 'WEEK') {
    const oneWeekAgo = new Date();
    oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
    filteredExpenses = monthExpenses.filter(e => e.date && new Date(e.date) >= oneWeekAgo);
  }

  document.getElementById('count').textContent = filteredExpenses.length + (filteredExpenses.length === 1 ? ' spesa' : ' spese');

  const listEl = document.getElementById('list');
  if(filteredExpenses.length > 0) {
    listEl.innerHTML = filteredExpenses.map(e => {
      let dateFormatted = '';
      if(e.date) {
        let d = new Date(e.date);
        dateFormatted = `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}`;
      }
      return `
      <div class="item">
        <i class="dot"></i>
        <div class="item-main">
          <b>${esc(e.desc)}</b>
          <span>${dateFormatted}</span>
        </div>
        <div class="item-amount">${euro(e.amount)}</div>
        <div class="actions">
          <button class="smallbtn" onclick="openModal(${e.id})">✎</button>
          <button class="smallbtn" onclick="removeExpense(${e.id})" style="color:#d90429;">×</button>
        </div>
      </div>
    `;}).join('');
  } else {
    listEl.innerHTML = `<div class="empty">Nessuna spesa trovata per questo mese.</div>`;
  }
}

function esc(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c] || c));
}

// Avvio applicazione
render();
</script>
</body>
</html>
